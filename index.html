<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>💛</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap"
    rel="stylesheet"
  >
</head>


<body>

  <div class="scene">

    <!-- Pétalos que caen -->
    <canvas id="flowers"></canvas>


    <!-- Árbol -->
    <main class="tree-container">

      <section
        class="tree-area"
        aria-label="Árbol de flores amarillas"
      >

        <!-- Copa -->
        <div
          class="tree-heart"
          id="treeHeart"
        ></div>


        <!-- Tronco -->
        <div class="trunk"></div>

      </section>

    </main>

  </div>


  <script src="script.js"></script>

</body>

</html>
